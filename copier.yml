# copier.yml — questions and settings for the PDCA quality-cycle harness template.
#
# Render a new project with:
#   copier copy gh:<you>/pdca-harness path/to/new-project
# Re-apply template updates later with:
#   copier update           (run inside the generated project)
#
# The generic PDCA model (Plan/Do/Check/Act, the 5/5/1 inside Check, the bundle
# state machine) is project-agnostic and ships verbatim. These questions collect
# only the repo-specific *integration* (docs 05): which tracker, which branches,
# which models run the two leaves, where bundles live.

_subdirectory: template
_templates_suffix: .jinja

# Files never copied into a rendered project. Setting _exclude REPLACES Copier's
# built-in list, so the defaults are re-listed here before our additions.
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # PCDA/ is plain-Markdown reference docs (readable in any viewer). It MAY also be
  # opened as an Obsidian vault; if so, don't render that optional local vault config.
  - ".obsidian"
  # Host-governance opt-outs (issue #67): a host with its own CI / merge governance
  # can omit the shipped equivalents. _exclude is Jinja-templated; an empty entry
  # matches nothing. Globs cover the source name with or without the .jinja suffix.
  - "{% if not ship_ci_workflow %}.github/workflows/check-gates.yml*{% endif %}"
  - "{% if not ship_merge_guard %}.claude/hooks/builder_guard.py*{% endif %}"
# Keep the default answers filename (.copier-answers.yml) so `copier update`
# finds it with no extra flag. The answers-file template is shipped at
# template/{{ _copier_conf.answers_file }}.jinja.

_message_after_copy: |
  PDCA harness rendered into {{ _copier_conf.dst_path }}.

  Next steps:
    1. Read PCDA/quality-cycle.md (the reference model) and docs/INTEGRATION.md
       (your repo's concretizations — fill the [planned] / TODO items).
    2. Try the vertical slice on the toy issue:
         cd {{ _copier_conf.dst_path }}
         PYTHONPATH=src python -m pdca_harness.cli init-issue TOY --from-brief examples/toy/brief.md
         PYTHONPATH=src python -m pdca_harness.cli run TOY
         PYTHONPATH=src python -m pdca_harness.cli status
    3. Replace the stub leaves (builder/reviewer) with real commands in pdca.toml
       once the deterministic gates exist (build order: gates -> driver -> batch -> Act).

# ----------------------------------------------------------------------------
# Project identity
# ----------------------------------------------------------------------------
project_name:
  type: str
  help: Human-readable project name (e.g. "Gramps Testbed")

project_slug:
  type: str
  help: Machine slug used in paths and package names
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-line description of what this project contributes to
  default: ""

# The installed console-script name (pyproject [project.scripts] + the CLI's --help).
# Each rendered instance installs this command; when several instances share a machine
# they collide on a single global name, so NAMESPACE it per project (e.g. "pdca-gramps",
# "wyrd-pdca"). Default "pdca" keeps the docs' examples literal for a single instance.
cli_name:
  type: str
  help: 'Console-script command this project installs (namespace it if you run multiple instances, e.g. "pdca-{{ project_slug }}")'
  default: "pdca"

author_name:
  type: str
  help: Primary author / maintainer name
  default: ""

author_email:
  type: str
  help: Primary author / maintainer email
  default: ""

# License the rendered project declares (pyproject + NOTICE). The harness itself is
# Apache-2.0; the rendered output carries no copyleft, so a permissive host can keep
# its own policy. An SPDX identifier (e.g. Apache-2.0, MIT, BSD-3-Clause). The shipped
# LICENSE file is the Apache-2.0 text — swap it if you choose a different license here.
project_license:
  type: str
  help: SPDX license the rendered project declares (Apache-2.0 keeps the shipped LICENSE)
  default: "Apache-2.0"

# ----------------------------------------------------------------------------
# Integration: tracker (docs 05 item 1)
# ----------------------------------------------------------------------------
tracker_system:
  type: str
  help: Bug/issue tracker this project triages from
  choices:
    GitHub Issues: github
    MantisBT: mantis
    Jira: jira
    Other: other
  default: github

tracker_url:
  type: str
  help: Base URL of the tracker (e.g. https://github.com/org/repo/issues)
  default: ""

issue_id_example:
  type: str
  help: How an issue ID appears in briefs/commits/PRs (e.g. "#123", "13418", "MANT-1")
  default: "#123"

# ----------------------------------------------------------------------------
# Integration: branches (docs 05 item 2)
# ----------------------------------------------------------------------------
default_branch:
  type: str
  help: Default branch fixes target unless an area rule overrides
  default: main

# ----------------------------------------------------------------------------
# Integration: bundle + process layout (docs 05 item 7)
# ----------------------------------------------------------------------------
bundle_root:
  type: str
  help: Directory holding per-cycle result bundles (results/issue_<id>/)
  default: results

process_dir:
  type: str
  help: Directory holding cross-cycle process artifacts (act-log, baseline)
  default: process

# ----------------------------------------------------------------------------
# Integration: the two model leaves (docs 03 §Implementation substrate)
# Stored in pdca.toml. The vertical slice ships with both set to "stub" so the
# driver runs offline; switch to "command" and set the argv once leaves are real.
# ----------------------------------------------------------------------------
builder_family:
  type: str
  help: Model family for the Do leaf (the builder)
  choices:
    Claude (claude -p): claude
    Other / not yet wired: other
  default: claude

reviewer_family:
  type: str
  help: Cross-vendor model family for the Check reviewer leaf (MUST differ from builder)
  choices:
    Codex (codex exec): codex
    Other / not yet wired: other
  default: codex

leaves_mode:
  type: str
  help: Run the Do/reviewer leaves as real commands, or as offline stubs (start here)
  choices:
    Stubs (offline; recommended to start): stub
    Real commands: command
  default: stub

# ----------------------------------------------------------------------------
# Integration: gates (docs 04). A host that already single-sources its gates in its
# own runner (e.g. `cargo xtask`, `make`, `just`) can DELEGATE to it: set a runner and
# each gate names a bare sub-command, so PDCA orchestrates the host runner instead of
# re-declaring the gates (issue #67). Leave blank to declare gate commands inline.
# ----------------------------------------------------------------------------
gates_runner:
  type: str
  help: "External gate runner to delegate to (e.g. 'cargo xtask'); blank = inline gate commands"
  default: ""

# ----------------------------------------------------------------------------
# Compose with the host's CI / merge governance (docs 05; issue #67). PDCA should
# SUPPLEMENT a host's existing PR/issue gates, not duplicate them. Keep these on
# (default) for a standalone project; turn one off when the host already provides it.
# ----------------------------------------------------------------------------
ship_ci_workflow:
  type: bool
  help: Ship the GitHub Actions merge re-gate (.github/workflows/check-gates.yml)? Off if the host runs its own CI.
  default: true

ship_merge_guard:
  type: bool
  help: Ship the builder/publisher STOP-discipline PreToolUse hook (builder_guard.py)? Off if host governance enforces it.
  default: true
