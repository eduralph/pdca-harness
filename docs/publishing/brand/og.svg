<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PDCA Harness — verified AI contribution, one quality cycle at a time">
  <rect width="1200" height="630" fill="#23201c"/>
  <g stroke="#efe8dc" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="110" x2="1200" y2="110"/><line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="96" y1="0" x2="96" y2="630"/><line x1="1104" y1="0" x2="1104" y2="630"/>
  </g>
  <g transform="translate(96,135) scale(7.5)">
    <g fill="none" stroke="#a65428" stroke-width="4.2">
      <path d="M24 7 A17 17 0 0 1 41 24"/>
      <path d="M41 24 A17 17 0 0 1 24 41" stroke-opacity="0.85"/>
      <path d="M24 41 A17 17 0 0 1 7 24" stroke-opacity="0.7"/>
      <path d="M7 24 A17 17 0 0 1 24 7" stroke-opacity="0.55"/>
    </g>
    <g stroke="#23201c" stroke-width="2.2">
      <line x1="24" y1="4" x2="24" y2="10"/><line x1="38" y1="24" x2="44" y2="24"/>
      <line x1="24" y1="38" x2="24" y2="44"/><line x1="4" y1="24" x2="10" y2="24"/>
    </g>
    <polygon points="18.5,2.6 18.5,11.4 26.2,7" fill="#a65428"/>
    <path d="M16.5 24.5 L22 30 L32 18.5" fill="none" stroke="#49c3a1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- quadrant labels around the mark -->
  <g font-family="'IBM Plex Mono', monospace" font-size="20" fill="#b9b0a2">
    <text x="276" y="128" text-anchor="middle">plan</text>
    <text x="458" y="322" text-anchor="start">do</text>
    <text x="276" y="520" text-anchor="middle">check</text>
    <text x="94" y="322" text-anchor="end">act</text>
  </g>
  <text x="520" y="245" font-family="'Barlow Semi Condensed', 'Arial Narrow', sans-serif" font-weight="600" font-size="88" fill="#efe8dc">PDCA Harness</text>
  <text x="524" y="322" font-family="'Source Sans 3', sans-serif" font-size="40" font-style="italic" fill="#efe8dc">Verified AI contribution,</text>
  <text x="524" y="370" font-family="'Source Sans 3', sans-serif" font-size="40" font-style="italic" fill="#efe8dc">one quality cycle at a time.</text>
  <text x="524" y="440" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#b9b0a2">Plan → Do → Check → Act for AI coding agents.</text>
  <text x="524" y="474" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#b9b0a2">Tests gate every change; a human signs off.</text>
  <text x="1104" y="580" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="24" fill="#e28c61">pdca.dev</text>
</svg>
