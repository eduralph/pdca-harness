name: Welcome first-time contributors

# Post one welcome comment on a contributor's first pull request, with what a PR
# needs in order to get through review.
#
# `pull_request_target` because a fork PR's `pull_request` token cannot comment. This
# trigger runs with write access, so this workflow MUST NOT check out the PR's code or
# put PR-controlled text into the script. It reads only the author's login and the PR
# number, through the event payload at run time.
#
# GitHub keeps calling an author a first-time contributor until a PR of theirs merges,
# so a second PR opened before then is skipped by looking for their earlier PRs. The
# marker keeps a re-run from posting twice.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    name: welcome
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Post the welcome comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- first-time-contributor-welcome -->';
            const { owner, repo } = context.repo;
            const { number, user: { login } } = context.payload.pull_request;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100,
            });
            if (pulls.some(p => p.user?.login === login && p.number < number)) {
              core.info(`#${number}: ${login} has an earlier PR, not welcoming.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            if (comments.some(c => c.body?.includes(MARKER))) {
              core.info(`#${number}: already welcomed.`);
              return;
            }

            const guide = `https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md`;
            const body = [
              MARKER,
              `Welcome, and thanks for your first contribution to ${repo}!`,
              '',
              'A few things that help a PR through:',
              '- Link an issue in the PR description with `Closes #N`.',
              '- Sign off each commit with `git commit -s`.',
              '- Start the subject with a conventional prefix, such as `fix:` or `docs:`.',
              '',
              'CI on a first PR waits for a maintainer to approve it, so a pause there is ' +
                `normal. [CONTRIBUTING.md](${guide}) has the details.`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            core.info(`#${number}: welcomed ${login}.`);
